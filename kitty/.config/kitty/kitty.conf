include themes/catppuccin-mocha.conf
include rose-pine.conf

# =============================================================================
# Font
# =============================================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Disable ligatures — preserves operator semantics in code
disable_ligatures always

# =============================================================================
# Cursor
# =============================================================================

cursor_shape          block
cursor_blink_interval 0
cursor_trail          3
cursor_trail_decay    0.05 0.2

# Cursor shape passthrough is handled by tmux terminal-overrides (Ss/Se)
# so tmux/nvim control cursor shape changes — do not override here

# =============================================================================
# Scrollback
# =============================================================================

scrollback_lines 10000

# =============================================================================
# Mouse
# =============================================================================

mouse_hide_wait 2.0
copy_on_select  no

# =============================================================================
# Performance
# =============================================================================

repaint_delay 10
input_delay   3
sync_to_monitor yes

# =============================================================================
# Terminal bell
# =============================================================================

enable_audio_bell    no
visual_bell_duration 0.0

# =============================================================================
# Window
# =============================================================================

window_padding_width    8
draw_minimal_borders    yes
inactive_text_alpha     1.0

# Hide tab bar — tmux owns all multiplexing
tab_bar_style hidden

# =============================================================================
# Shell integration
# =============================================================================

# Enables OSC 133 prompt marks, cwd tracking, and kitten ssh
shell_integration enabled no-cursor

# =============================================================================
# Clipboard
# =============================================================================

# OSC 52 — works on macOS, Wayland, and X11 without platform branching.
# tmux forwards OSC 52 to Kitty when set-clipboard is on (already set in tmux).
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# =============================================================================
# Keyboard
# =============================================================================

# Treat Option as Alt on macOS — required for A-h/j/k/l (smart-splits resize)
macos_option_as_alt both

# Shift+Enter: send CSI-u sequence; zsh ZLE binds it to newline (not execute)
map shift+enter send_text all \x1b[13;2u

# =============================================================================
# macOS
# =============================================================================

macos_quit_when_last_window_closed yes
macos_show_window_title_in         menubar

# =============================================================================
# URLs
# =============================================================================

url_style         curly
open_url_with     default
detect_urls       yes


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME