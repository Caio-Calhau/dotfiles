include themes/catppuccin-mocha.conf
include rose-pine.conf

# =============================================================================
# Shell integration
# =============================================================================

# Enables OSC 133 prompt marks, cwd tracking, and kitten ssh
shell_integration enabled no-cursor

# =============================================================================
# Clipboard
# =============================================================================

# OSC 52 — works on macOS, Wayland, and X11 without platform branching.
# tmux forwards OSC 52 to Kitty when set-clipboard is on (already set in tmux).
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# =============================================================================
# Keyboard
# =============================================================================

# Treat Option as Alt on macOS — required for A-h/j/k/l (smart-splits resize)
macos_option_as_alt both

# Shift+Enter: send CSI-u sequence; zsh ZLE binds it to newline (not execute)
map shift+enter send_text all \x1b[13;2u

# =============================================================================
# macOS
# =============================================================================

macos_quit_when_last_window_closed yes
macos_show_window_title_in         menubar

# =============================================================================
# URLs
# =============================================================================

url_style         curly
open_url_with     default
detect_urls       yes


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME

cursor #ebbcba
