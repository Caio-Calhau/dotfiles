##### RELOAD CONFIG ###########################################################

unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

##### GENERAL #################################################################

set -g prefix C-s
unbind C-b

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-kitty:RGB'

set-option -g status-position top

# Faster escape sequences for vim/tmux responsiveness
set -sg escape-time 10

##### TERMINAL ################################################################

# Enable focus events and cursor shape passthrough (cursor blinks on pane switch)
set -g focus-events on
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Kitty graphics protocol passthrough (required for image.nvim)
# allow-passthrough was added in tmux 3.3; skip on older versions (e.g. WSL default)
%if #{>=:#{version},3.3}
set -g allow-passthrough on
%endif
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Clear screen
bind -n C-l send-keys C-l

##### PANE NAVIGATION #########################################################

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

##### PANE SPLITS #############################################################

bind '[' split-window -h -c "#{pane_current_path}"

##### PANE / WINDOW CLOSE #####################################################

bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind '&' confirm-before -p "kill-pane #P? (y/n)" kill-pane

##### PANE RESIZE (smart-splits) ##############################################

bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

##### PANE ZOOM ###############################################################

bind z if -F "#{window_zoomed_flag}" \
    "resize-pane -Z; select-pane -l" \
    "resize-pane -Z"

##### WINDOW NAMING ###########################################################

# Open new windows in current directory
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Allow shell to rename windows
set -g allow-rename on

# Disable tmux auto rename
set -g automatic-rename off

##### COPY MODE / VIM BEHAVIOR ################################################

# Use vim-style keybindings
set -g mode-keys vi

# Enter copy-mode with Prefix + v
bind v copy-mode

# Visual mode
bind-key -T copy-mode-vi v send -X begin-selection

# Visual line mode
bind-key -T copy-mode-vi V send -X select-line

# Visual block mode
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# Yank selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Better movement
bind-key -T copy-mode-vi H send -X start-of-line
bind-key -T copy-mode-vi L send -X end-of-line

# Search like vim
bind-key -T copy-mode-vi / command-prompt -p "search down" \
    "send -X search-forward '%%'"

bind-key -T copy-mode-vi ? command-prompt -p "search up" \
    "send -X search-backward '%%'"

# Repeat search
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

##### COPY MODE STYLING #######################################################

# Selection highlight colors
# Adjust to match your Neovim Visual highlight
set -g mode-style "bg=#585b70,fg=#cdd6f4"

# Search match colors
set -g copy-mode-match-style "fg=#1e1e2e,bg=#f9e2af"

# Current search match
set -g copy-mode-current-match-style "fg=#1e1e2e,bg=#a6e3a1"

##### PANE BORDERS ############################################################

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

##### STATUS BAR ##############################################################

set -g status-left ""
set -g status-right-length 100

set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #T"

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

##### TMUX PLUGINS ############################################################

set -g @plugin 'tmux-plugins/tpm'

# CPU
set -g @plugin 'tmux-plugins/tmux-cpu'

# Theme
set -g @plugin 'catppuccin/tmux'

# Vim navigation integration
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Clipboard / yank improvements
set -g @plugin 'tmux-plugins/tmux-yank'

# Auto restore sessions
# set -g @continuum-restore 'on'

##### CLIPBOARD ###############################################################

# OSC 52 — tmux forwards yank sequences to the outer terminal (Kitty).
# Kitty handles clipboard natively on macOS, Wayland, and X11.
# tmux-yank provides the copy-mode-vi y binding and platform detection.
set -g set-clipboard on

##### TPM #####################################################################

run '~/.tmux/plugins/tpm/tpm'
